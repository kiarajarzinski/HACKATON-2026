name: hackaton26

services:
  db:
    image: postgres:16-alpine
    container_name: hackaton26-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: hackaton
      POSTGRES_PASSWORD: hackaton
      POSTGRES_DB: hackaton_db
    ports:
      - "5432:5432"
    volumes:
      - hackaton26_db_data:/var/lib/postgresql/data

  keycloak-db:
    image: postgres:16-alpine
    container_name: hackaton26-keycloak-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
      POSTGRES_DB: keycloak
    volumes:
      - hackaton26_keycloak_db_data:/var/lib/postgresql/data

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: hackaton26-keycloak
    restart: unless-stopped
    command: start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    depends_on:
      - keycloak-db

volumes:
  hackaton26_db_data:
  hackaton26_keycloak_db_data: